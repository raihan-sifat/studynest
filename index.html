    <meta name="description" content="StudyNest - Organize your learning. Track your progress. Build better study habits." />
    <meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f17" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudyNest" />
    <meta property="og:url" content="https://studynest-ruddy.vercel.app/" />
    <meta property="og:title" content="StudyNest — Organize Your Learning & Track Progress" />
    <meta
      property="og:description"
      content="One focused workspace for courses, assignments, study sessions, learning goals, bilingual notes, and progress analytics."
    />
    <meta property="og:image" content="https://studynest-ruddy.vercel.app/og.png" />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('studynest-theme')
          var dark = stored
            ? stored === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
